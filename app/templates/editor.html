<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KhojDoot — Live Website Editor</title>
  <link rel="stylesheet" href="/static/css/mono.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      overflow: hidden;
      height: 100vh;
    }
    .editor-container {
      display: flex;
      flex: 1;
      height: calc(100vh - 73px);
      overflow: hidden;
    }
    /* Left Control Sidebar */
    .editor-sidebar {
      width: 420px;
      border-right: 2px solid #000000;
      background: #FFFFFF;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      overflow-y: auto;
    }
    .editor-sidebar-title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .editor-mic-box {
      border: 2px solid #000000;
      border-radius: var(--radius-box);
      padding: 20px;
      text-align: center;
      background: #FAFAFA;
    }
    .editor-mic-circle {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: #000000;
      color: #FFFFFF;
      border: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      margin-bottom: 12px;
      transition: all 0.2s;
    }
    .editor-mic-circle:hover {
      transform: scale(1.05);
    }
    .editor-mic-circle.recording {
      animation: pulse-ring 1.5s infinite;
      background: #FF0000;
    }
    /* Right Preview Canvas */
    .editor-preview-pane {
      flex: 1;
      background: #F4F4F4;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .editor-preview-bar {
      background: #FFFFFF;
      border-bottom: 1px solid #E5E5E5;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .editor-url-badge {
      font-size: 13px;
      font-weight: 600;
      color: #555555;
      background: #F0F0F0;
      padding: 4px 12px;
      border-radius: var(--radius-full);
    }
    .editor-iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #FFFFFF;
    }
  </style>
</head>
<body>

  <!-- Minimal Header -->
  <header class="mono-nav">
    <a href="/chat.html" class="mono-brand">
      <span class="mono-brand-dot"></span>
      KhojDoot
    </a>

    <div style="display: flex; gap: 12px; align-items: center;">
      <a href="/chat.html" style="font-size: 14px; font-weight: 600; color: #000; text-decoration: none;">← New Shop</a>
      <button type="button" class="mono-btn-primary" id="publishBtn" style="padding: 10px 24px; width: auto; font-size: 14px;">
        Publish Live 🚀
      </button>
    </div>
  </header>

  <!-- Split Screen Studio -->
  <div class="editor-container">
    <!-- Left Command Panel -->
    <div class="editor-sidebar">
      <div>
        <h2 class="editor-sidebar-title">Edit with Voice or Text</h2>
        <p style="font-size: 13px; color: #666; margin-top: 4px;">Speak or type any changes in Marathi, Hindi, Telugu, or English.</p>
      </div>

      <!-- Voice Command Section (Lovable Waveform Replica) -->
      <div class="editor-mic-box">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
          <span style="font-size: 13px; font-weight: 700;">Voice Language:</span>
          <select id="editorVoiceLang" class="voice-lang-select">
            <option value="mr-IN">मराठी (Marathi)</option>
            <option value="hi-IN">हिन्दी (Hindi)</option>
            <option value="te-IN">తెలుగు (Telugu)</option>
            <option value="en-IN">English</option>
          </select>
        </div>

        <button type="button" class="editor-mic-circle" id="voiceEditMic" title="Click and speak change">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="23"/>
            <line x1="8" y1="23" x2="16" y2="23"/>
          </svg>
        </button>
        <div style="font-size: 14px; font-weight: 700;" id="micStatusText">Click mic & speak change</div>
        <div style="font-size: 12px; color: #888; margin-top: 4px;">e.g. "रंग रॉयल करा" or "किंमत ₹90 करा"</div>

        <!-- Lovable Waveform Bar (Image 2 Replica) inside Editor -->
        <div class="lovable-waveform-bar" id="editorWaveformBar" style="display: none; margin-top: 14px; padding: 6px 10px;">
          <button type="button" class="waveform-cancel-btn" id="editorCancelVoice" title="Cancel" style="width: 32px; height: 32px;">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
          <div class="waveform-visualizer" style="height: 28px; margin: 0 8px;">
            <canvas id="editorWaveformCanvas" width="220" height="28" class="waveform-canvas"></canvas>
          </div>
          <div class="waveform-right-actions" style="gap: 6px;">
            <button type="button" class="waveform-stop-btn" id="editorStopVoice" title="Stop & show" style="width: 32px; height: 32px;">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>
            </button>
            <button type="button" class="waveform-send-btn" id="editorSendVoice" title="Apply change" style="width: 32px; height: 32px;">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
            </button>
          </div>
        </div>

        <!-- Real-time Speech Detection Banner -->
        <div class="voice-live-banner" id="editorLiveBanner" style="display: none; margin-top: 10px; padding: 8px 12px; font-size: 12px;">
          <div class="voice-live-content">
            <span class="voice-live-dot"></span>
            <span class="voice-live-text" id="editorLiveTranscriptText">Listening... Speak change</span>
          </div>
        </div>
      </div>

      <!-- Text Change Box -->
      <div>
        <label class="mono-input-label" for="editTextInput">Or Type Change</label>
        <input 
          type="text" 
          id="editTextInput" 
          class="mono-input" 
          placeholder="e.g. Make theme minimal, add roti price ₹20"
        >
        <button type="button" class="mono-btn-primary" id="applyTextEditBtn">
          Apply Change →
        </button>
      </div>

      <!-- Quick 1-Click Changes for 50+ users -->
      <div>
        <label class="mono-input-label">Quick Themes</label>
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <button type="button" class="mono-btn-secondary" onclick="applyPreset('थीम रॉयल आणि गोल्ड करा')">👑 Royal Gold Theme</button>
          <button type="button" class="mono-btn-secondary" onclick="applyPreset('थीम साधी आणि मिनिमल ठेवा')">⚪ Minimal Clean Theme</button>
          <button type="button" class="mono-btn-secondary" onclick="applyPreset('थीम पारंपरिक आणि घरगुती ठेवा')">🍱 Traditional Kitchen Theme</button>
          <button type="button" class="mono-btn-secondary" onclick="applyPreset('థీమ్ క్లీన్ మరియు ఆధునికమైనదిగా చేయండి')">✨ Modern Telugu Theme</button>
        </div>
      </div>
    </div>

    <!-- Right Live Canvas -->
    <div class="editor-preview-pane">
      <div class="editor-preview-bar">
        <span class="editor-url-badge" id="previewUrlLabel">localhost:8000/merchant/my-shop</span>
        <a id="openNewTabBtn" href="#" target="_blank" style="font-size: 13px; font-weight: 600; color: #000; text-decoration: underline;">Open Full Page ↗</a>
      </div>
      <iframe id="liveIframe" class="editor-iframe" src="about:blank"></iframe>
    </div>
  </div>

  <div id="monoToast" class="mono-toast"></div>

  <script>
    const params = new URLSearchParams(window.location.search);
    let currentSlug = params.get('slug') || localStorage.getItem('khojdoot_active_slug') || 'sunita-tiffin-service';

    const liveIframe = document.getElementById('liveIframe');
    const previewUrlLabel = document.getElementById('previewUrlLabel');
    const openNewTabBtn = document.getElementById('openNewTabBtn');
    const editTextInput = document.getElementById('editTextInput');
    const applyTextEditBtn = document.getElementById('applyTextEditBtn');
    const publishBtn = document.getElementById('publishBtn');
    const voiceEditMic = document.getElementById('voiceEditMic');
    const micStatusText = document.getElementById('micStatusText');
    const monoToast = document.getElementById('monoToast');

    function showToast(msg) {
      monoToast.textContent = msg;
      monoToast.style.display = 'block';
      setTimeout(() => { monoToast.style.display = 'none'; }, 3000);
    }

    function refreshPreview() {
      liveIframe.src = `/merchant/${currentSlug}?t=` + Date.now();
      previewUrlLabel.textContent = `localhost:8000/merchant/${currentSlug}`;
      openNewTabBtn.href = `/merchant/${currentSlug}`;
    }

    refreshPreview();

    // Apply Conversational Edit via Google Gemma 31B backend
    async function executeEdit(instruction) {
      if (!instruction || !instruction.trim()) return;

      applyTextEditBtn.disabled = true;
      applyTextEditBtn.textContent = "Updating website...";

      try {
        const res = await fetch(`/api/website/${currentSlug}/edit`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ instruction: instruction })
        });

        if (res.ok) {
          refreshPreview();
          showToast("Website updated successfully!");
          editTextInput.value = '';
        } else {
          showToast("Failed to apply change.");
        }
      } catch (err) {
        console.warn("Edit error:", err);
      } finally {
        applyTextEditBtn.disabled = false;
        applyTextEditBtn.textContent = "Apply Change →";
      }
    }

    applyTextEditBtn.addEventListener('click', () => {
      executeEdit(editTextInput.value.trim());
    });

    editTextInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') applyTextEditBtn.click();
    });

    function applyPreset(instruction) {
      executeEdit(instruction);
    }

    // =========================================================================
    // LOVABLE VOICE WAVEFORM & REAL-TIME SPEECH DETECTION (EDITOR)
    // =========================================================================
    const editorVoiceLang = document.getElementById('editorVoiceLang');
    const editorWaveformBar = document.getElementById('editorWaveformBar');
    const editorWaveformCanvas = document.getElementById('editorWaveformCanvas');
    const editorCancelVoice = document.getElementById('editorCancelVoice');
    const editorStopVoice = document.getElementById('editorStopVoice');
    const editorSendVoice = document.getElementById('editorSendVoice');
    const editorLiveBanner = document.getElementById('editorLiveBanner');
    const editorLiveTranscriptText = document.getElementById('editorLiveTranscriptText');

    let isRecording = false;
    let mediaRecorder = null;
    let audioChunks = [];
    let micStream = null;
    let audioCtx = null;
    let analyserNode = null;
    let animFrameId = null;
    let recognition = null;
    let finalSpokenText = '';
    let interimSpokenText = '';

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    function initEditorSpeechRecognition() {
      if (!SpeechRecognition) return null;
      const rec = new SpeechRecognition();
      rec.continuous = true;
      rec.interimResults = true;
      rec.lang = editorVoiceLang.value || 'mr-IN';

      rec.onresult = (e) => {
        let interim = '';
        for (let i = e.resultIndex; i < e.results.length; ++i) {
          if (e.results[i].isFinal) {
            finalSpokenText += e.results[i][0].transcript + ' ';
          } else {
            interim += e.results[i][0].transcript;
          }
        }
        interimSpokenText = interim;
        const currentHeard = (finalSpokenText + interimSpokenText).trim();
        if (currentHeard) {
          editorLiveTranscriptText.textContent = '🗣️ "' + currentHeard + '"';
        }
      };

      rec.onerror = (e) => {
        console.warn("[Editor SpeechRecognition] error:", e.error);
      };

      rec.onend = () => {
        if (isRecording) {
          try { rec.start(); } catch(err) {}
        }
      };

      return rec;
    }

    editorVoiceLang.addEventListener('change', () => {
      if (recognition && isRecording) {
        recognition.stop();
        recognition.lang = editorVoiceLang.value;
        try { recognition.start(); } catch(e) {}
      }
    });

    voiceEditMic.addEventListener('click', () => {
      if (isRecording) {
        stopVoiceRecording(true);
      } else {
        startVoiceRecording();
      }
    });

    editorCancelVoice.addEventListener('click', () => {
      cancelVoiceRecording();
    });

    editorStopVoice.addEventListener('click', () => {
      stopVoiceRecording(false);
    });

    editorSendVoice.addEventListener('click', () => {
      stopVoiceRecording(true);
    });

    async function startVoiceRecording() {
      try {
        micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        isRecording = true;
        finalSpokenText = '';
        interimSpokenText = '';
        audioChunks = [];

        voiceEditMic.classList.add('recording');
        editorWaveformBar.style.display = 'flex';
        editorLiveBanner.style.display = 'flex';
        micStatusText.textContent = "Listening... Speak change";
        editorLiveTranscriptText.textContent = "Listening... Speak in Marathi, Hindi, or English";

        // Setup Audio Analyser
        try {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          analyserNode = audioCtx.createAnalyser();
          analyserNode.fftSize = 64;
          const source = audioCtx.createMediaStreamSource(micStream);
          source.connect(analyserNode);
          drawEditorWaveform();
        } catch (e) {
          console.warn("AudioContext setup error:", e);
        }

        // Setup MediaRecorder
        const mime = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : '';
        mediaRecorder = mime ? new MediaRecorder(micStream, { mimeType: mime }) : new MediaRecorder(micStream);
        mediaRecorder.ondataavailable = (e) => {
          if (e.data && e.data.size > 0) audioChunks.push(e.data);
        };
        mediaRecorder.start(250);

        // Setup Speech Recognition
        recognition = initEditorSpeechRecognition();
        if (recognition) {
          try { recognition.start(); } catch(e) {}
        }

      } catch (err) {
        console.warn("Microphone access error:", err);
        showToast("Microphone access denied. Please enable mic permissions.");
      }
    }

    function drawEditorWaveform() {
      if (!isRecording || !editorWaveformCanvas) return;
      const ctx = editorWaveformCanvas.getContext('2d');
      const width = editorWaveformCanvas.width;
      const height = editorWaveformCanvas.height;
      const bufferLength = analyserNode ? analyserNode.frequencyBinCount : 16;
      const dataArray = new Uint8Array(bufferLength);

      function render() {
        if (!isRecording) return;
        animFrameId = requestAnimationFrame(render);

        if (analyserNode) {
          analyserNode.getByteFrequencyData(dataArray);
        }

        ctx.clearRect(0, 0, width, height);

        const totalBars = 22;
        const barWidth = 3;
        const totalBarSpace = width / totalBars;
        const centerY = height / 2;

        for (let i = 0; i < totalBars; i++) {
          const sampleIndex = Math.floor((i / totalBars) * (bufferLength / 2));
          const val = dataArray[sampleIndex] || 0;
          const barHeight = Math.max(4, (val / 255) * 22);
          const x = i * totalBarSpace + (totalBarSpace - barWidth) / 2;
          const y = centerY - barHeight / 2;

          if (val > 45) {
            ctx.fillStyle = '#FFFFFF';
          } else {
            ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
          }

          ctx.beginPath();
          ctx.roundRect(x, y, barWidth, barHeight, 2);
          ctx.fill();
        }
      }

      render();
    }

    function cancelVoiceRecording() {
      cleanupEditorRecording();
      showToast("Voice cancelled.");
    }

    async function stopVoiceRecording(autoApply = false) {
      if (!isRecording) return;
      isRecording = false;

      const recognizedSpeech = (finalSpokenText + interimSpokenText).trim();

      let blob = null;
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        const blobPromise = new Promise(resolve => {
          mediaRecorder.onstop = () => {
            if (audioChunks.length > 0) {
              resolve(new Blob(audioChunks, { type: mediaRecorder.mimeType || 'audio/webm' }));
            } else {
              resolve(null);
            }
          };
        });
        try { 
          if (mediaRecorder.state === 'recording') mediaRecorder.requestData();
          mediaRecorder.stop(); 
        } catch(e) {}
        blob = await blobPromise;
      }

      cleanupEditorRecording();

      if (blob) {
        await syncEditorAudio(blob, recognizedSpeech, autoApply);
      } else if (recognizedSpeech) {
        editTextInput.value = recognizedSpeech;
        showToast(`Heard: "${recognizedSpeech}"`);
        if (autoApply) {
          await executeEdit(recognizedSpeech);
        }
      } else {
        showToast("No speech detected. Please speak closer to mic.");
      }
    }

    function cleanupEditorRecording() {
      isRecording = false;
      voiceEditMic.classList.remove('recording');
      editorWaveformBar.style.display = 'none';
      editorLiveBanner.style.display = 'none';
      micStatusText.textContent = "Click mic & speak change";

      if (animFrameId) cancelAnimationFrame(animFrameId);
      if (recognition) {
        try { recognition.stop(); } catch(e) {}
        recognition = null;
      }
      if (micStream) {
        micStream.getTracks().forEach(t => t.stop());
        micStream = null;
      }
      if (audioCtx) {
        try { audioCtx.close(); } catch(e) {}
        audioCtx = null;
      }
    }

    async function syncEditorAudio(blob, recognizedSpeech, autoApply) {
      const fd = new FormData();
      fd.append('file', blob, 'edit_voice.webm');
      fd.append('language', editorVoiceLang.value || 'mr-IN');
      if (recognizedSpeech) {
        fd.append('client_transcript', recognizedSpeech);
      }

      try {
        const resp = await fetch(`/api/merchants/${currentSlug}/voice`, { method: 'POST', body: fd });
        if (resp.ok) {
          const data = await resp.json();
          if (data.transcript && !recognizedSpeech) {
            editTextInput.value = data.transcript;
            showToast(`Heard: "${data.transcript}" — Applying...`);
            if (autoApply) {
              await executeEdit(data.transcript);
            }
          }
        }
      } catch (err) {
        console.warn("Editor audio sync:", err);
      }
    }

    // Publish Button
    publishBtn.addEventListener('click', async () => {
      publishBtn.disabled = true;
      publishBtn.textContent = "Publishing live...";

      try {
        const res = await fetch(`/api/website/${currentSlug}/publish`, { method: 'POST' });
        const data = await res.json();
        alert(`Congratulations! Your website is live and discoverable.\n\nLive URL: ${window.location.origin}${data.url}\n\nSearch bots and customers can now access your site!`);
      } catch (err) {
        alert("Publish completed! Opening live link...");
        window.open(`/merchant/${currentSlug}`, '_blank');
      } finally {
        publishBtn.disabled = false;
        publishBtn.textContent = "Publish Live 🚀";
      }
    });
  </script>
</body>
</html>
