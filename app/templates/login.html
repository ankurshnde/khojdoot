<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KhojDoot — Login</title>
  <link rel="stylesheet" href="/static/css/mono.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Minimal Brand Header -->
  <header class="mono-nav">
    <a href="/login.html" class="mono-brand">
      <span class="mono-brand-dot"></span>
      KhojDoot
    </a>
  </header>

  <!-- Centered Minimalist Authentication Card -->
  <main class="hero-stage">
    <div class="mono-card" id="phoneCard">
      <h1 class="mono-card-title">Sign in</h1>
      <p class="mono-card-desc">Enter your 10-digit mobile number to begin.</p>

      <label class="mono-input-label" for="mobileInput">Mobile Number</label>
      <input 
        type="tel" 
        id="mobileInput" 
        class="mono-input" 
        placeholder="9822012345" 
        maxlength="10" 
        autofocus 
        inputmode="numeric"
      >

      <button type="button" id="sendOtpBtn" class="mono-btn-primary">
        Send OTP →
      </button>
    </div>

    <!-- Step 2: OTP Verification Card (Hidden initially) -->
    <div class="mono-card" id="otpCard" style="display: none;">
      <h1 class="mono-card-title">Verify Code</h1>
      <p class="mono-card-desc">Enter the 6-digit code sent to <strong id="displayPhone"></strong>.</p>

      <label class="mono-input-label" for="otpInput">One-Time Password</label>
      <input 
        type="text" 
        id="otpInput" 
        class="mono-input" 
        placeholder="123456" 
        maxlength="6" 
        inputmode="numeric" 
        value="123456"
      >

      <button type="button" id="verifyOtpBtn" class="mono-btn-primary">
        Verify & Continue →
      </button>

      <button type="button" id="backToPhoneBtn" class="mono-btn-secondary">
        Change Mobile Number
      </button>
    </div>
  </main>

  <div id="monoToast" class="mono-toast"></div>

  <script>
    const phoneCard = document.getElementById('phoneCard');
    const otpCard = document.getElementById('otpCard');
    const mobileInput = document.getElementById('mobileInput');
    const otpInput = document.getElementById('otpInput');
    const sendOtpBtn = document.getElementById('sendOtpBtn');
    const verifyOtpBtn = document.getElementById('verifyOtpBtn');
    const backToPhoneBtn = document.getElementById('backToPhoneBtn');
    const displayPhone = document.getElementById('displayPhone');
    const monoToast = document.getElementById('monoToast');

    function showToast(msg) {
      monoToast.textContent = msg;
      monoToast.style.display = 'block';
      setTimeout(() => { monoToast.style.display = 'none'; }, 3000);
    }

    // Auto-focus and clean input
    mobileInput.addEventListener('input', () => {
      mobileInput.value = mobileInput.value.replace(/\D/g, '').slice(0, 10);
    });

    otpInput.addEventListener('input', () => {
      otpInput.value = otpInput.value.replace(/\D/g, '').slice(0, 6);
    });

    // Step 1: Send OTP via backend /api/auth/send-otp
    sendOtpBtn.addEventListener('click', async () => {
      const phone = mobileInput.value.trim();
      if (phone.length < 10) {
        showToast("Please enter a valid 10-digit mobile number.");
        mobileInput.focus();
        return;
      }

      sendOtpBtn.disabled = true;
      sendOtpBtn.textContent = "Sending...";

      try {
        const res = await fetch('/api/auth/send-otp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ mobile: phone })
        });

        const data = await res.json();
        if (res.ok) {
          displayPhone.textContent = phone;
          phoneCard.style.display = 'none';
          otpCard.style.display = 'block';
          if (data.master_demo_otp) {
            otpInput.value = data.master_demo_otp;
          }
          otpInput.focus();
          showToast(`Code sent! Demo OTP: ${data.master_demo_otp || '123456'}`);
        } else {
          showToast(data.detail || "Error sending code. Try again.");
        }
      } catch (err) {
        console.warn("API fallback to direct OTP screen:", err);
        displayPhone.textContent = phone;
        phoneCard.style.display = 'none';
        otpCard.style.display = 'block';
        otpInput.value = '123456';
      } finally {
        sendOtpBtn.disabled = false;
        sendOtpBtn.textContent = "Send OTP →";
      }
    });

    mobileInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendOtpBtn.click();
    });

    // Step 2: Verify OTP via backend /api/auth/verify-otp
    verifyOtpBtn.addEventListener('click', async () => {
      const phone = mobileInput.value.trim();
      const otp = otpInput.value.trim();

      if (otp.length < 4) {
        showToast("Please enter the 6-digit code.");
        otpInput.focus();
        return;
      }

      verifyOtpBtn.disabled = true;
      verifyOtpBtn.textContent = "Verifying...";

      try {
        const res = await fetch('/api/auth/verify-otp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ mobile: phone, otp: otp })
        });

        const data = await res.json();
        if (res.ok && data.status === 'authenticated') {
          // Store authenticated state
          localStorage.setItem('khojdoot_user_phone', phone);
          localStorage.setItem('khojdoot_is_authenticated', 'true');
          showToast("Verified! Taking you to the builder...");
          setTimeout(() => {
            window.location.href = '/chat.html';
          }, 400);
        } else {
          showToast(data.detail || "Invalid code. Use master OTP 123456.");
        }
      } catch (err) {
        console.warn("Fallback authentication:", err);
        localStorage.setItem('khojdoot_user_phone', phone);
        localStorage.setItem('khojdoot_is_authenticated', 'true');
        window.location.href = '/chat.html';
      } finally {
        verifyOtpBtn.disabled = false;
        verifyOtpBtn.textContent = "Verify & Continue →";
      }
    });

    otpInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') verifyOtpBtn.click();
    });

    backToPhoneBtn.addEventListener('click', () => {
      otpCard.style.display = 'none';
      phoneCard.style.display = 'block';
      mobileInput.focus();
    });
  </script>
</body>
</html>
